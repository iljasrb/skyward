name: Build

# Every push is linted and tested, and the recovery service and the packer are
# built for the phone. The image is built and published by release.yml when a
# bronco-* tag is pushed; this workflow only says the tree builds.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Documentation alone does not need the recovery built.
    paths-ignore:
      - "**.md"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --features folkpatch
      - name: Lint what runs on the phone
        run: |
          cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward -p skyward-install -- -D warnings
          cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward --features folkpatch -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward --features folkpatch
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
