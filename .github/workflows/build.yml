name: Build

# Every push is linted and tested, and the recovery service and the packer are
# built for the phone. Device images are built on the device branches; this
# workflow only says the tree builds. This branch carries no root methods, so
# nothing here turns the `roots` feature on.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Documentation alone does not need the recovery built.
    paths-ignore:
      - "**.md"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # A merge of upstream lands with its texts written in three languages;
      # this says to run scripts/locales.py convert before committing.
      - name: Check the pages' texts are in the language file
        run: python3 scripts/locales.py check
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Lint what runs on the phone
        run: |
          cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward -p skyward-install -p skyward-systems -p skyward-system-init -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
